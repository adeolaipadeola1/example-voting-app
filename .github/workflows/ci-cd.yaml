name: Voting App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-scan-publish:
    name: Build, scan and publish
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: vote
            context: ./vote
          - service: worker
            context: ./worker
          - service: result
            context: ./result

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/voting-app-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Tag image for publication
        if: github.event_name == 'push'
        run: |
          docker tag "${{ steps.image.outputs.name }}:${GITHUB_SHA}" "${{ steps.image.outputs.name }}:latest"

      - name: Push commit-tagged image
        if: github.event_name == 'push'
        run: docker push "${{ steps.image.outputs.name }}:${GITHUB_SHA}"

      - name: Push latest image
        if: github.event_name == 'push'
        run: docker push "${{ steps.image.outputs.name }}:latest"
